name: ai_home_brain
description: A mobile-first smart home control app foundation.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  cloud_firestore: ^7.2.0
  firebase_ai: ^5.1.0
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  local_auth: ^3.0.2
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - firebase-applet-config.json
